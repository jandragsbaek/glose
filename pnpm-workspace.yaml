packages:
  - apps/*
  - oxlint-plugin-glose
  - packages/*

# Electron has no install script; apps/desktop/scripts/launch-electron.mjs fetches the binary on first launch.
allowBuilds:
  electron: false
  electron-winstaller: false

catalog:
  "@effect/atom-react": 4.1.2
  "@effect/platform-node": 4.1.2
  "@effect/vitest": 4.1.2
  "@types/node": ^24.19.2
  effect: 4.1.2
  typescript: ^7.0.2
  # Vite+ ships its own Vite build; every `vite` dependency resolves to it.
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1

overrides:
  "@effect/vitest>vitest": "-"
  vite: "catalog:"
  vite-plus: "catalog:"

packageExtensions:
  # Our patch makes @effect/vitest import vite-plus/test. A catalog: spec here
  # resolves through the vite-plus override above.
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"

patchedDependencies:
  "@effect/vitest@4.1.2": patches/@effect__vitest@4.1.2.patch
